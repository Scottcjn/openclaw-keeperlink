name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff + mypy
        run: pip install ruff mypy pydantic httpx
      - name: ruff check
        run: ruff check .
      - name: mypy (strict on shared/)
        run: mypy --strict shared/
